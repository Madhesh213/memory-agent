<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Agent ~ Your Personal AI Sanctuary</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600&family=Lora:ital,wght@0,500;1,400&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #fbf9f5;
            color: #2c2925;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .main-wrapper {
            width: 100%;
            max-width: 1000px;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            font-family: 'Lora', serif;
            font-size: 2.2rem;
            color: #433e38;
            margin: 0 0 8px 0;
        }

        header p {
            color: #78716c;
            font-size: 0.95rem;
            margin: 0;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }

        .card {
            background: #ffffff;
            border: 1px solid #eae5dc;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(67, 62, 56, 0.04);
            display: flex;
            flex-direction: column;
        }

        h2 {
            font-family: 'Lora', serif;
            margin-top: 0;
            color: #433e38;
            font-size: 1.35rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #78716c;
            margin-bottom: 6px;
            display: block;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 18px;
            background: #faf8f5;
            border: 1px solid #e6dfd3;
            color: #2c2925;
            border-radius: 12px;
            font-family: inherit;
            font-size: 0.95rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #b5a48b;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(181, 164, 139, 0.15);
        }

        /* Custom File Upload Box */
        .file-drop-zone {
            border: 2px dashed #e6dfd3;
            padding: 16px;
            text-align: center;
            border-radius: 12px;
            background: #faf8f5;
            margin-bottom: 18px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .file-drop-zone:hover {
            border-color: #b5a48b;
        }
        .file-drop-zone input {
            display: none;
        }
        .file-label {
            font-size: 0.85rem;
            color: #8c8279;
        }

        button {
            background: #6b5b4e;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            width: 100%;
            transition: background 0.2s, transform 0.1s;
        }
        button:hover { background: #56483d; }
        button:active { transform: scale(0.98); }

        .chat-box {
            background: #faf8f5;
            border: 1px solid #e6dfd3;
            height: 280px;
            border-radius: 12px;
            padding: 16px;
            overflow-y: auto;
            margin-bottom: 15px;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.4;
        }
        .message.ai {
            background: #f2eee9;
            color: #433e38;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.user {
            background: #6b5b4e;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .source-tag { font-size: 0.78rem; color: #8a735e; margin-top: 4px; font-weight: 500; }
        .conflict-tag { font-size: 0.78rem; color: #b45309; margin-top: 4px; font-weight: 500; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <header>
            <h1>🌿 Memory Agent</h1>
            <p>Your gentle digital sanctuary for thoughts, notes, PDFs, and memories.</p>
        </header>

        <div class="container">
            <!-- Left Panel: Upload Memories -->
            <div class="card">
                <h2>📖 Preserve a Memory</h2>
                <form id="uploadForm">
                    <label>Title or Document Name</label>
                    <input type="text" id="title" placeholder="e.g., Autumn Trip Notes or Lecture 1" required>
                    
                    <label>Upload PDF or Image</label>
                    <div class="file-drop-zone" onclick="document.getElementById('fileInput').click()">
                        <span class="file-label" id="fileLabel">📁 Click to select a PDF or image file</span>
                        <input type="file" id="fileInput" accept=".pdf,image/*" onchange="handleFileSelect(event)">
                    </div>

                    <label>Memory Content or Notes</label>
                    <textarea id="content" rows="3" placeholder="Write down details or paste extracted text here..." required></textarea>

                     <label>Source Type</label>
                     <input type="text" id="sourceType" placeholder="WhatsApp / emails / PDFs / screenshots / notes / calendars" required>

                    <button type="submit">Save to Memories 🕊️</button>
                </form>
            </div>

            <!-- Right Panel: Ask AI Memory -->
            <div class="card">
                <h2>☕ Chat with Agent</h2>
                <div class="chat-box" id="chatBox">
                    <div class="message ai">Hello! I'm your cozy memory companion. Ask me anything about what you've saved or stored today. ✨</div>
                </div>
                <div style="margin-top: auto;">
                    <input type="text" id="questionInput" placeholder="Ask a question (e.g., What was in my notes?)" style="margin-bottom: 10px;">
                    <button onclick="askAgent()">Ask Companion 💭</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        let detectedSourceType = "Note";

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                document.getElementById('fileLabel').innerText = `✅ Attached: ${file.name}`;
                document.getElementById('title').value = file.name;
                
                if (file.type.includes('pdf')) {
                    detectedSourceType = "PDF Document";
                } else if (file.type.includes('image')) {
                    detectedSourceType = "Image Scan";
                } else {
                    detectedSourceType = "Uploaded File";
                }
                
                // Simulate reading file contents automatically into the text box
                document.getElementById('content').value = `[Uploaded file content container for: ${file.name}]`;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams();
            formData.append('title', document.getElementById('title').value);
            formData.append('content', document.getElementById('content').value);
            formData.append('source_type', detectedSourceType);

            try {
                const res = await fetch(`${API_URL}/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                alert("✨ " + data.message);
                document.getElementById('uploadForm').reset();
                document.getElementById('fileLabel').innerText = "📁 Click to select a PDF or image file";
                detectedSourceType = "Note";
            } catch (err) {
                alert("Could not reach backend server. Make sure uvicorn is running!");
            }
        });

        async function askAgent() {
            const q = document.getElementById('questionInput').value;
            if (!q) return;

            const chatBox = document.getElementById('chatBox');
            chatBox.innerHTML += `<div class="message user">${q}</div>`;
            document.getElementById('questionInput').value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch(`${API_URL}/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: q })
                });
                const data = await res.json();

                let replyHtml = `<div class="message ai">${data.answer}`;
                if (data.sources.length > 0) {
                    replyHtml += `<div class="source-tag">📌 Source: ${data.sources.join(', ')}</div>`;
                }
                if (data.conflict) {
                    replyHtml += `<div class="conflict-tag">⚠️ ${data.conflict}</div>`;
                }
                replyHtml += `</div>`;

                chatBox.innerHTML += replyHtml;
                chatBox.scrollTop = chatBox.scrollHeight;
            } catch (err) {
                chatBox.innerHTML += `<div class="message ai">⚠️ Ah, I lost connection to the server. Is your Python backend running?</div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }
    </script>
</body>
</html>
